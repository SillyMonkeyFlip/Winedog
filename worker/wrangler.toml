name = "winedog-api"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Sites allowed to call this API. Add more separated by commas.
[vars]
ALLOWED_ORIGINS = "https://winedog.site,https://www.winedog.site,http://localhost:8080"
EMAIL_FROM = "WineDog <noreply@winedog.site>"

# Run `npx wrangler d1 create winedog` and paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "winedog"
database_id = "6260773d-4965-4b94-9d99-39e546818430"

# Secrets (never put these in this file). Set them with:
#   npx wrangler secret put ADMIN_PASSWORD
#   npx wrangler secret put RESEND_API_KEY
